<!doctype html><meta charset="utf-8"><style>body{background:#223440;color:white;font:14px sans-serif}.row{display:flex}canvas{width:224px;height:224px;image-rendering:pixelated}</style><div id="pictures" class="row"></div><pre id="result">RUNNING</pre><script src="../../creation-data.js"></script><script src="../../creation-core.js"></script><script src="../../creation-art-data.js"></script><script src="../../creation-art.js"></script><script>
(async()=>{const a=PlayerCreation.createDraft().appearance;const out=[];for(const body of['male_basic','female_basic']){a.body_outfit_set_id=body;a.body_profile=body.split('_')[0];for(const pose of['idle','cast']){try{const r=await CreationArt.render(a,pose);document.querySelector('#pictures').appendChild(r.canvas);out.push({body,pose,meta:r.meta,pass:true});}catch(e){out.push({body,pose,error:e.message,pass:false});}}try{const p=await CreationArt.portrait(a);document.querySelector('#pictures').appendChild(p);out.push({portrait:true,width:p.width});}catch(e){out.push({error:e.message});}document.querySelector('#result').textContent=JSON.stringify({results:out,stats:CreationArt.stats()});document.title='DONE';})()
</script>
